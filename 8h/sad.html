<!DOCTYPE HTML>

*{margin:0;padding:0;box-sizing:border-box;user-select:none;pointer-events:none}body{min-height:100vh;background:#000;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;overflow:hidden;position:relative}#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .1s ease;opacity:0}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:1;pointer-events:none}.content{position:relative;z-index:2;text-align:center}.btn{padding:20px 50px;font-size:2rem;font-weight:bold;letter-spacing:4px;text-transform:uppercase;background:transparent;color:#fff;border:3px solid #fff;cursor:pointer;transition:all .3s ease;font-family:'Courier New',monospace;box-shadow:0 0 20px rgba(255,255,255,0.3);animation:pulse 2s infinite;pointer-events:auto}.btn:hover{background:#fff;color:#000;transform:scale(1.05);box-shadow:0 0 40px rgba(255,255,255,0.8)}@keyframes pulse{0%{text-shadow:0 0 5px cyan}50%{text-shadow:0 0 20px magenta}100%{text-shadow:0 0 5px cyan}}.glitch-text{position:fixed;bottom:40px;left:0;width:100%;text-align:center;color:#782222;font-size:1.5rem;font-family:'Courier New',monospace;text-shadow:0 0 10px #000;z-index:3;opacity:0;transition:opacity 1s ease;white-space:pre-wrap;padding:0 20px;background-color:transparent}

al(function(){if(audio&&audio.paused)audio.play()},1000)})();
